name: Preflight catalog D1 (read-only)
on:
  push:
    branches: [feat/jotafy-catalog-meta-ads-20261030]
    paths:
      - .github/workflows/catalog-d1-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jotafy-d1-production-maintenance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Confirm identity and available D1 restoration history
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare token ausente"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account ID ausente"; exit 1; }
          node -e "const c=require('./wrangler.jsonc');const d=c.d1_databases.find(x=>x.binding==='ORDERS');if(d.database_name!=='receitas-premium-150-orders'||d.database_id!=='e5ba3e0b-eff5-4bfd-8461-fe09c1eceb7a')process.exit(1);"
          npx wrangler d1 info receitas-premium-150-orders --json > "$RUNNER_TEMP/d1-info.json"
          node -e "const i=require(process.env.RUNNER_TEMP+'/d1-info.json');console.log('Database:',i.name,'Storage version:',i.version)"
          npx wrangler d1 time-travel info receitas-premium-150-orders
      - name: Inspect pending migrations and current catalog state (read-only)
        run: |
          npx wrangler d1 migrations list receitas-premium-150-orders --remote
          npx wrangler d1 execute receitas-premium-150-orders --remote --command "SELECT COUNT(*) AS catalog_table_exists FROM sqlite_master WHERE type='table' AND name='jotafy_products';"
