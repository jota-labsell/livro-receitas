name: Validate checkout and Meta
on:
  push:
    branches: [fix/checkout-card-diagnostics-20261028]
  pull_request:
    branches: [feat/150-doces-r10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:commerce
      - run: npm run build
