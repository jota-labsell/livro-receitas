name: Validate checkout and Meta
on:
  push:
    branches: [fix/checkout-card-diagnostics-20261028]
  pull_request:
    branches: [feat/150-doces-r10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:commerce
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression tests (no real payments)
        run: |
          npm run start -- --port 3000 > /tmp/next-test.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null; then break; fi
            sleep 2
          done
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux64/chrome' -type f -print -quit)"
          test -n "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          npx playwright test --grep 'card field non-critical|Meta consent|Meta stays disabled'
