name: Aplicar migration aditiva 0011 no D1 de produção
on:
  push:
    branches: [feat/jotafy-catalog-meta-ads-20261030]
    paths:
      - .github/workflows/catalog-d1-migrate.yml
permissions:
  contents: read
concurrency:
  group: jotafy-d1-production-maintenance
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Validar database exato e confirmar rollback disponível
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'));const d=c.d1_databases.find(x=>x.binding==='ORDERS');if(!d||d.database_name!=='receitas-premium-150-orders'||d.database_id!=='e5ba3e0b-eff5-4bfd-8461-fe09c1eceb7a')process.exit(1);"
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 time-travel info receitas-premium-150-orders
      - name: Bloquear qualquer outra migração pendente
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list receitas-premium-150-orders --remote | tee "$RUNNER_TEMP/d1-pending.txt"
          node -e "const fs=require('node:fs');const s=fs.readFileSync(process.env.RUNNER_TEMP+'/d1-pending.txt','utf8');const m=[...s.matchAll(/\\b\\d{4}_[a-z0-9_-]+\\.sql\\b/g)].map(x=>x[0]);if(m.length!==1||m[0]!=='0011_catalog_meta_ads.sql'){console.error('Aborting: unexpected pending migrations:',m);process.exit(1)};console.log('Confirmed sole pending migration:',m[0])"
      - name: Aplicar somente a migration 0011 no D1 remoto
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply receitas-premium-150-orders --remote
      - name: Validar tabelas e produto principal sem consultar pedidos
        shell: bash
        run: |
          npx wrangler d1 execute receitas-premium-150-orders --remote --command "SELECT id,price_cents,status,revision FROM jotafy_products WHERE id='150-doces-comer-vender'; SELECT id,token_enc FROM meta_ads_connection LIMIT 0; SELECT state_hash FROM meta_ads_oauth_states LIMIT 0;"
