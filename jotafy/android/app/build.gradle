plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
 namespace 'com.jotafy.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.jotafy.app'; minSdk 26; targetSdk 35
  versionCode 2; versionName '2.0.0'
  testInstrumentationRunner 'com.jotafy.app.SmokeRunner'
  buildConfigField 'boolean', 'FIREBASE_CONFIGURED', file('google-services.json').exists().toString()
 }
 buildFeatures { buildConfig true }
 signingConfigs {
  original {
   if (System.getenv('JOTAFY_KEYSTORE')) {
    storeFile file(System.getenv('JOTAFY_KEYSTORE'))
    storePassword System.getenv('JOTAFY_STORE_PASSWORD')
    keyAlias System.getenv('JOTAFY_KEY_ALIAS')
    keyPassword System.getenv('JOTAFY_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { applicationIdSuffix '.preview'; versionNameSuffix '-preview'; resValue 'string','app_name','JotaFy Prévia' }
  release { if (System.getenv('JOTAFY_KEYSTORE')) signingConfig signingConfigs.original; resValue 'string','app_name','JotaFy' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation platform('com.google.firebase:firebase-bom:34.7.0')
 implementation 'com.google.firebase:firebase-messaging'
}

tasks.register('verifyOriginalSignature') {
 doLast {
  if (System.getenv('JOTAFY_KEYSTORE')) {
   def store = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
   file(System.getenv('JOTAFY_KEYSTORE')).withInputStream { store.load(it, System.getenv('JOTAFY_STORE_PASSWORD').toCharArray()) }
   def cert = store.getCertificate(System.getenv('JOTAFY_KEY_ALIAS'))
   if (cert == null) throw new GradleException('Original signing alias not found.')
   def actual = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
   if (actual != 'd4e18334cad0c6b7620e6b02187db434be78ce9a197a63f220b75e3ce930d0fa') throw new GradleException('Signing certificate differs from installed JotaFy 1.0; refusing replacement.')
  }
 }
}
tasks.matching { it.name == 'packageRelease' }.configureEach { dependsOn 'verifyOriginalSignature' }